[project]
name = "silentrank"
version = "0.1.0"
description = "Harness for studying silent ranking regressions in recommender pipelines under dependency upgrades"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scipy",
]

[project.scripts]
silentrank = "silentrank.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silentrank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
