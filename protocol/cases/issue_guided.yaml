collection: issue_guided
selection_rule: >-
  Development leads from upstream issue reports, fixes, dependency constraints,
  and release notes. Lead status means source triage is recorded and the pilot
  has yet to reproduce the symptom. These leads are enriched for faults and are
  excluded from systematic prevalence. They are used only to study mechanisms.
  A cross-reference to an existing systematic case identifies shared evidence.
field_guide:
  visibility: >-
    What the cited source documents: crash (exception, import or build failure,
    failing test), warning (a warning is emitted), silent (execution completed
    with wrong or changed values and no failure signal), unknown (the source
    shows no observed symptom, for example a release note or a pin without a
    reported symptom). A release note alone never gives "silent".
  evidence_quality: >-
    maintainer_confirmed (a project maintainer or collaborator confirmed or
    fixed the symptom), user_report (reported or proposed by a user or outside
    contributor, not yet confirmed), release_note_only (documented upstream
    change or dependency pin with no reported downstream symptom).
  mechanism_guess: >-
    Our hypothesis about the cause. It is not established unless the notes
    quote a source that establishes it.
  upgrade_link: >-
    Where the notes say the dependency-upgrade link is our hypothesis, the
    source does not attribute the symptom to an upgrade.
search_scope:
  checked_on: "2026-11-13"
  repositories:
    - recommenders-team/recommenders
    - benfred/implicit
    - RUCAIBox/RecBole
    - lenskit/lkpy
    - PreferredAI/cornac
    - NicolasHug/Surprise
    - MTSWebServices/RecTools  # formerly MobileTeleSystems/RecTools; the old name no longer resolves in search
    - LienM/recpack
  methods:
    - >-
      gh search issues --include-prs, read-only, per repository, with the pilot plan's
      keywords: "numpy 2", "results changed", "different results", "metrics dropped",
      "after upgrading", scipy, "pandas 3", argsort, argpartition, reproducib.
    - >-
      Second round: tie, "float32 precision", nondeterministic, "flaky test",
      tolerance, "dtype float64", "torch version", "numpy version", "pandas version",
      numba; plus targeted RecBole queries in English and Chinese.
    - Full reading (gh issue/pr view, gh pr diff) of every item cited below.
    - >-
      Release notes read from tagged sources: pandas doc/source/whatsnew/v3.0.0.rst
      (tag v3.0.0) and SciPy doc/source/release/1.11.0 to 1.15.0 notes (tag v1.15.0).
    - >-
      Follow-up issue and PR queries on implicit, Surprise, RecTools, Cornac,
      LensKit and the RecPack mirror. Searched project setup notes and dependency
      files for NumPy <2 and SciPy <=1.13.1 downstream constraints.
  limitations: >-
    Search is keyword-based and not exhaustive. The second keyword round hit the
    GitHub search rate limit: "numba" in recommenders-team/recommenders and all
    second-round queries for benfred/implicit, RUCAIBox/RecBole, lenskit/lkpy,
    PreferredAI/cornac, NicolasHug/Surprise and LienM/recpack returned nothing
    because they were rate limited, not because nothing exists. Rerun on 13 November: 59 of the 61 queries completed (126 unique hits, 123 not previously listed). Titles were triaged, the plausible ones read, and four were added as L17-L20; all are crashes or pins, none silent. Still unrun after two network failures: "flaky test" in benfred/implicit and tolerance in RUCAIBox/RecBole. benfred/implicit issue 607 (title suggests an API difference between model types) could not be loaded.
    Downstream pin searches found compatibility workarounds. A pin motivated by
    changed ranking quality remains unverified. Pilot reproductions are recorded
    on the relevant leads and cross-referenced to ledger case IDs.
  related_evidence:
    - url: https://github.com/benfred/implicit/issues/710
      note: BPR factor differences with multiple threads are a same-version noise lead.
    - url: https://github.com/MTSWebServices/RecTools/releases/tag/v0.10.0
      note: Tie ordering can change with the project's CPU-to-GPU ranking default change.
    - url: https://pypi.org/pypi/recpack/0.3.6/json
      note: RecPack pins NumPy 1.x and SciPy 1.x. Metadata gives no ranking symptom.
    - url: https://gitlab.com/recpack-maintainers/recpack/-/commit/d4299773
      note: RecPack's canonical repository documents pandas and Torch 2.x support for Python 3.11.
    - url: https://github.com/ogamircs/genrec-demo/blob/45f1cfd9b429c6784ac670779b9e79b450a3642f/README.md
      note: Downstream SAR/BPR benchmark pins NumPy 1.26.4 because of the Recommenders version constraint in L2b.
    - url: https://huggingface.co/spaces/khalednabawi11/Book-Recommender-System/blob/main/requirements.txt
      note: Downstream app pins NumPy below 2 alongside scikit-surprise. The requirements give no reason for the pin.
    - url: https://github.com/vin1bun/recommendation-system/blob/eeece7f11cf6a10e956acc0d7bfec0471808e61a/README.md
      note: Downstream project cites NumPy 2.x compatibility when switching from Surprise to SciPy SVD. Exact versions and failure details are absent.
    - url: https://github.com/RUCAIBox/RecBole/issues/488
      note: The discussion concerns consistency across RecBole releases and supplies no dependency transition.
    - url: https://github.com/recommenders-team/recommenders/pull/2396
      note: >-
        Not a dependency upgrade. SAR lexicographers mutual information used sparse
        `*` (matrix product) instead of an element-wise product, producing mostly
        -inf similarities; the stored reference files (sim_lex*.csv, userpred_lex3.csv)
        had been generated from the wrong behaviour, so the tests encoded it. Useful
        as evidence that upstream test oracles can freeze wrong numbers.
    - url: https://github.com/RUCAIBox/RecBole/issues/1196
      note: >-
        Not a dependency upgrade. Metrics differed between RecBole 0.2.1 and 1.0.1
        because RecBole's own config default changed (eval mode full vs uni100).
    - url: https://github.com/recommenders-team/recommenders/pull/2337
      note: >-
        Not a dependency upgrade. Benchmark MAP/nDCG changed after fixing
        top_k/remove_seen handling in helper code.
    - url: https://arxiv.org/abs/2610.09267
      note: >-
        From the Lane C hand-over note, not opened here: BBCBench mined Python
        breaking-change cases with queries such as "compatibility with numpy 2";
        not yet inspected for recommender projects.

leads:
  - id: L1
    project: recommenders-team/recommenders
    url: https://github.com/recommenders-team/recommenders/issues/1954
    claimed_symptom: >-
      Issue 1954: "With scipy 1.10.1, the item similarity matrix is a dense matrix"
      but with SciPy 1.11.1 SAR's item_similarity printed with shape (). Issue 1951:
      "Scipy 1.11.0 and 1.11.1 are breaking all our tests". Users then hit a
      ValueError in recommend_k_items (issue 2015); PR 2083 comments show a later
      TypeError "'coo_matrix' object is not subscriptable" with SciPy 1.13.
    versions_old: {scipy: "1.10.1"}
    versions_new: {scipy: "1.11.0 / 1.11.1 (and 1.13.0 for the follow-up TypeError)"}
    versions:
      dependency: scipy
      old: "1.10.1"
      new: "1.11.1"
      first_changed: "1.11.0"
      application_fix: "recommenders 1.2.0 / 1.2.1 (PR 2083 merged 2024-04-29)"
    visibility: crash
    mechanism_guess: >-
      Confirmed by a SciPy contributor in scipy#18796: SciPy 1.11.0 release note
      "Division of sparse arrays by a dense array now returns sparse arrays".
      SAR's similarity functions wrapped the result in np.array(), which turns a
      sparse object into a 0-d object array. Fix: `.toarray()` when the result
      is sparse. The 1.13 TypeError comes from sparse min(axis=1) returning COO.
    evidence_quality: maintainer_confirmed
    status: visible_failure
    closure:
      decided: '2026-11-14'
      reason: "Source documents a crash, fixed in Recommenders 1.2.1. Not reproduced here: SAR 1.2.1 ran on SciPy 1.11.4, 1.12.0 and 1.13.1 with NumPy 1.26.4 (S1-P4, S2-P4 identical)."
      evidence:
      - protocol/pipelines_p3_p4.md
    evidence:
      - https://github.com/recommenders-team/recommenders/issues/1951
      - https://github.com/recommenders-team/recommenders/pull/2083
      - https://github.com/recommenders-team/recommenders/issues/2015
      - https://github.com/scipy/scipy/issues/18796
      - https://docs.scipy.org/doc/scipy-1.11.0/release/1.11.0-notes.html#scipy-sparse-improvements
      - https://github.com/recommenders-team/recommenders/releases/tag/1.2.1
    notes: >-
      Answer to pilot lead L1: a crash, not silently wrong numbers. Every
      documented symptom is a failing CI test or an exception; no source reports
      that SAR ran and returned different rankings. PR 2083 also removed the
      scipy<1.11 cap. A maintainer comment in PR 2083 notes CI passed on Python 3.8
      (SciPy 1.10) with np.array(result) and on 3.9+ (SciPy 1.11+) with
      result.toarray(), so the fix is version-conditional. This transition starts
      before S1; check Python and wheel compatibility separately.

  - id: L1b
    project: recommenders-team/recommenders
    url: https://github.com/recommenders-team/recommenders/issues/2126
    claimed_symptom: >-
      Cornac BiVAE notebook test fails with AttributeError "'csc_matrix' object has
      no attribute 'A'" during fit. Cornac issue 629 reports the same for
      ItemKNN/UserKNN recommend() with NumPy 1.26 and SciPy 1.14.
    versions_old: {scipy: "1.13.1"}
    versions_new: {scipy: "1.14.0"}
    versions:
      dependency: scipy
      old: "1.13.1"
      new: "1.14.0"
      application_report: "cornac 2.2.1 discussed by maintainers"
    visibility: crash
    mechanism_guess: >-
      SciPy 1.14.0 expired deprecation: the `.A` and `.H` attributes were removed
      (release notes, deprecated since 1.11.0). Cornac PR 631 replaced `.A`.
    evidence_quality: maintainer_confirmed
    status: visible_failure
    closure:
      decided: '2026-11-14'
      reason: "Source documents a crash in Cornac BiVAE under newer SciPy. Not exercised: BiVAE is not among the study's pipelines."
    evidence:
      - https://github.com/recommenders-team/recommenders/pull/2127
      - https://github.com/PreferredAI/cornac/issues/629
      - https://github.com/PreferredAI/cornac/pull/631
      - https://docs.scipy.org/doc/scipy/release/1.14.0-notes.html#expired-deprecations
    notes: >-
      Recommenders PR 2127 (the "scipy <= 1.13.1" pin in pilot lead L1) exists for
      this Cornac crash, not for SAR. Verify the installed Cornac version and the
      BiVAE-specific repair before replay.

  - id: L2
    project: recommenders-team/recommenders
    url: https://github.com/recommenders-team/recommenders/issues/2112
    claimed_symptom: >-
      LibFFMConverter.fit() raises AttributeError "module 'numpy' has no attribute
      'float'" with NumPy 1.26 (problem since 1.24).
    versions_old: {numpy: "<1.24"}
    versions_new: {numpy: ">=1.24 (reported on 1.26)"}
    versions:
      dependency: numpy
      first_changed: "1.24.0"
      reported: "1.26.x"
      application_fix: "recommenders 1.2.1"
    visibility: crash
    mechanism_guess: Expired NumPy aliases np.float / np.int (deprecated 1.20, removed 1.24).
    evidence_quality: maintainer_confirmed
    status: visible_failure
    closure:
      decided: '2026-11-14'
      reason: "Source documents a crash (removed np.float) in LibFFMConverter. Not exercised by the study's pipelines."
    evidence:
      - https://github.com/recommenders-team/recommenders/pull/2113
      - https://numpy.org/doc/1.24/release/1.24.0-notes.html#expired-deprecations
      - https://github.com/recommenders-team/recommenders/releases/tag/1.2.1
    notes: >-
      Half of the pilot plan's "Fix issues with numpy (#2113 #2120)" note. PR 2113 was
      merged by maintainers. Not a NumPy 2 case and not silent.

  - id: L2b
    project: recommenders-team/recommenders
    url: https://github.com/recommenders-team/recommenders/pull/2120
    claimed_symptom: >-
      PR body: "Numpy has recently been updated to 2.0.0, with multiple breaking
      changes. Until the library usage is migrated, I pinned down the version to <2."
      No specific symptom is named.
    versions_old: {numpy: "1.26.x"}
    versions_new: {numpy: "2.0.0"}
    versions:
      dependency: numpy
      restricted: "<2"
      first_excluded: "2.0.0"
      application: "recommenders 1.2.1"
    visibility: unknown
    mechanism_guess: Precautionary major-version pin; no mechanism stated.
    evidence_quality: release_note_only
    status: visible_failure
    closure:
      decided: '2026-11-14'
      reason: "The pin gave no symptom, but this study observed the breakage it guards against: Recommenders 1.2.1 SAR crashes on every NumPy 2 environment (np.NaN), adjudicated in the ledger."
      evidence: []
    evidence:
      - https://github.com/recommenders-team/recommenders/issues/2224
      - https://github.com/recommenders-team/recommenders/pull/2225
      - https://github.com/recommenders-team/recommenders/releases/tag/1.2.1
    notes: >-
      A pin without a reported symptom. Later NumPy 2 reports in Recommenders are
      crashes (L9 Surprise import, L14 LightGCN np.mat, L15 TF-IDF TypeError).

  - id: L3
    project: numpy/numpy
    url: https://numpy.org/doc/2.0/release/2.0.0-notes.html#minor-changes-in-behavior-of-sorting-functions
    claimed_symptom: >-
      NumPy 2.0 release notes: sorting functions with methods that are not stable
      may return slightly different results compared to 1.26.x, including the
      default method of argsort and argpartition.
    versions_old: {numpy: "1.26.x"}
    versions_new: {numpy: "2.0.0"}
    versions: {dependency: numpy, old: "1.26.x", new: "2.0.0"}
    visibility: unknown
    mechanism_guess: >-
      Unstable top-K selection reorders exactly tied scores, changing order or
      membership at the cut-off.
    evidence_quality: release_note_only
    status: reproduced
    closure:
      decided: '2026-11-14'
      reason: "Reproduced as a silent behavioural change: NumPy 2.0 unstable partition reorders tied scores (N1, Q2, B1 reference item-kNN; same inference effect on two CPU hosts). No quality loss at any tolerance."
      evidence:
      - protocol/reproducers/numpy_unstable_topk.py
    notes: >-
      L11 records a downstream contract violation involving tie order. Its
      dependency-upgrade link remains a separate hypothesis.
    pilot_reproduction:
      ledger_case_id: N1-P1-float32
      ledger_comparison_id: 6c11ab8010afae53cc0eb208
      versions: {dependency: numpy, old: "1.26.4", new: "2.0.2"}
      mode: inference
      stage: S7
      outcome: behavioral_change
      result: >-
        Same-host replay with frozen scores, masks and IDs reproduced native
        top-K changes limited to exact ties. NumPy rollback restored the old
        ranking and reapplying the upgrade restored the change. Canonical
        lists matched. Mean primary NDCG@10 loss was 0.0, with a 95% interval
        of [0.0, 0.0]. The case met all three pilot equivalence bounds.
      synthetic_reproducer: protocol/reproducers/numpy_unstable_topk.py

  - id: L4
    project: numpy/numpy
    url: https://numpy.org/doc/2.0/numpy_2_0_migration_guide.html#changes-to-numpy-data-type-promotion
    claimed_symptom: >-
      NumPy 2.0 preserves NumPy scalar precision in promotion (NEP 50): a float32
      array plus a NumPy float64 scalar now returns float64; a NumPy float32 scalar
      plus a Python float now returns float32.
    versions_old: {numpy: "1.26.x"}
    versions_new: {numpy: "2.0.0"}
    versions: {dependency: numpy, old: "1.26.x", new: "2.0.0"}
    visibility: unknown
    mechanism_guess: >-
      Mixed-dtype arithmetic in normalisation or regularisation changes precision,
      which can break or create near-ties.
    evidence_quality: release_note_only
    status: not_reproducible
    closure:
      decided: '2026-11-14'
      reason: "No pipeline change in this study was attributable to NEP 50. Tested directly for implicit BM25: restoring legacy promotion under NumPy 2.0.2 did not change the result (the cause was log1p)."
      evidence:
      - protocol/reproducers/README.md
    evidence:
      - https://numpy.org/neps/nep-0050-scalar-promotion.html
    notes: A ranker effect requires an actual mixed-dtype operation on its executed path.

  - id: L5
    project: pandas-dev/pandas
    url: https://pandas.pydata.org/docs/whatsnew/v3.0.0.html#other-removals
    claimed_symptom: >-
      pandas 3.0 release notes (removals): "Changed the default value of observed
      in DataFrame.groupby and Series.groupby to True".
    versions_old: {pandas: "2.3.x"}
    versions_new: {pandas: "3.0.0"}
    versions: {dependency: pandas, old: "2.3.x", new: "3.0.0"}
    visibility: unknown
    mechanism_guess: >-
      Grouping on categorical keys now omits categories absent from the data;
      a catalog or id mapping built from groups can shrink silently.
    evidence_quality: release_note_only
    status: not_tested
    closure:
      decided: '2026-11-14'
      reason: "Not exercised: the study's preprocessing (P0) never groups categorical columns. P0 under pandas 2.3 to 3.0 (D2, Q9) and 3.0 to 3.1 (D3) produced identical checkpoints."
      evidence: []
    evidence:
      - https://github.com/pandas-dev/pandas/issues/51811
      - https://github.com/lenskit/lkpy/issues/988
    notes: >-
      Applies only where preprocessing groups on categorical columns. LensKit's
      pandas 3 port (PR 993) needed only string-type fixes; no recommender
      project reported an observed-default symptom.

  - id: L5b
    project: pandas-dev/pandas
    url: https://pandas.pydata.org/docs/whatsnew/v3.0.0.html#consistent-copy-view-behaviour-with-copy-on-write
    claimed_symptom: >-
      pandas 3.0: every indexing result behaves as a copy, so chained assignment
      "will stop working"; SettingWithCopyWarning is removed.
    versions_old: {pandas: "2.3.x"}
    versions_new: {pandas: "3.0.0"}
    versions: {dependency: pandas, old: "2.3.x", new: "3.0.0"}
    visibility: warning
    mechanism_guess: >-
      Code that relied on chained assignment updating the parent leaves fields
      unchanged (for example a rating rescale or filter flag not applied).
    evidence_quality: release_note_only
    status: not_tested
    closure:
      decided: '2026-11-14'
      reason: "Not exercised: P0 performs no chained assignment. No pandas warnings were logged in the pandas 3 P0 runs."
      evidence: []
    evidence:
      - https://pandas.pydata.org/pandas-docs/version/2.3/user_guide/copy_on_write.html#chained-assignment
    notes: >-
      Visibility "warning" refers to pandas' chained-assignment warning described
      in the copy-on-write guide; not confirmed in our runs. pandas 2.3 is
      recommended as a step to surface deprecation warnings. Check whether any
      pipeline code uses chained assignment at all.

  - id: L5c
    project: pandas-dev/pandas
    url: https://pandas.pydata.org/docs/whatsnew/v3.0.0.html#dedicated-string-data-type-by-default
    claimed_symptom: >-
      pandas 3.0 infers a dedicated `str` dtype for string data instead of object.
    versions_old: {pandas: "2.3.x"}
    versions_new: {pandas: "3.0.0"}
    versions: {dependency: pandas, old: "2.3.x", new: "3.0.0"}
    visibility: unknown
    mechanism_guess: >-
      Code that branches on object dtype, or factorises string ids, takes another
      path or produces a different id order.
    evidence_quality: release_note_only
    status: not_tested
    closure:
      decided: '2026-11-14'
      reason: "Not exercised: P0 reads integer IDs only, so the pandas 3 string dtype never applies."
      evidence: []
    evidence:
      - https://github.com/lenskit/lkpy/pull/993
    notes: >-
      LensKit PR 993 needed large-string (LargeUtf8) support in IDIndex for pandas 3;
      described as making things work, no ranking effect reported.

  - id: L5d
    project: recommenders-team/recommenders
    url: https://github.com/recommenders-team/recommenders/pull/2296
    claimed_symptom: >-
      Compatibility shim for groupby.apply(include_groups=False) in
      negative_feedback_sampler. A maintainer's review says behaviour on pandas <2.2
      "isn't equivalent": without include_groups=False the user column is passed
      into the applied function, so output could carry an extra column.
    versions_old: {pandas: "<2.2"}
    versions_new: {pandas: ">=2.2 (3.0 removed include_groups=True)"}
    versions: {dependency: pandas, old: "2.x", new: "3.0.0"}
    visibility: unknown
    mechanism_guess: >-
      pandas 3.0 removed include_groups=True for DataFrameGroupBy.apply, so applied
      functions no longer see grouping columns; version-conditional shims can give
      different frames on different pandas versions.
    evidence_quality: maintainer_confirmed
    status: not_tested
    closure:
      decided: '2026-11-14'
      reason: "Not exercised: the Recommenders negative-feedback sampler is not part of the study's pipelines."
    evidence:
      - https://pandas.pydata.org/docs/whatsnew/v3.0.0.html#other-removals
    notes: >-
      What the maintainer confirmed is a column-set difference in the sampler's
      output across pandas versions, not a ranking or metric change. Weak lead;
      check whether the extra column changes sampled negatives.

  - id: L5e
    project: pandas-dev/pandas
    url: https://pandas.pydata.org/docs/whatsnew/v3.0.0.html#datetime-timedelta-resolution-inference
    claimed_symptom: >-
      pandas 3.0 infers datetime resolution: parsed strings default to microseconds,
      not nanoseconds. The release notes warn that converting to integers "will give
      integers 1000x smaller".
    versions_old: {pandas: "2.3.x"}
    versions_new: {pandas: "3.0.0"}
    versions: {dependency: pandas, old: "2.3.x", new: "3.0.0"}
    visibility: unknown
    mechanism_guess: >-
      Time-aware steps (temporal splits, SAR time decay, recency features) that cast
      datetimes to int64 get timestamps in a different unit, changing decay weights
      or split boundaries without an error.
    evidence_quality: release_note_only
    status: not_tested
    closure:
      decided: '2026-11-14'
      reason: "Not exercised: P0 keeps integer Unix timestamps and parses no datetime strings."
      evidence: []
    notes: >-
      Our candidate, not reported by any of the eight projects. Applicable only if a
      pipeline parses timestamps as datetimes and then casts to integers. RecBole
      issue 1653 (open) shows timestamps changing value during loading, unrelated
      to a pandas version, as a reminder that this field is fragile.

  - id: L6
    project: RUCAIBox/RecBole
    url: https://github.com/RUCAIBox/RecBole/blob/9a6f63d8d4a5b989fe27955a833f813a6d86041e/recbole/config/configurator.py
    claimed_symptom: >-
      Tagged RecBole code assigns `np.float` from `np.float_`, which NumPy 2.0 removed.
      PR 2203 ("Fix numpy 2 compat") closed unmerged; PR 2187 (open) lists further
      NumPy 2, SciPy and PyTorch 2.6 fixes.
    versions_old: {numpy: "1.26.x"}
    versions_new: {numpy: "2.0.0"}
    versions: {dependency: numpy, old: "1.26.x", new: "2.0.0", application: "recbole 1.2.1"}
    visibility: crash
    mechanism_guess: Removed NumPy aliases; expected AttributeError at import or config time.
    evidence_quality: release_note_only
    status: visible_failure
    closure:
      decided: '2026-11-14'
      reason: "Crash expected from code inspection (removed np.float_). Not exercised: RecBole is not run, because it does not run on NumPy 2."
      evidence:
      - protocol/pipelines_p7_torch.md
    evidence:
      - https://numpy.org/doc/2.0/numpy_2_0_migration_guide.html#main-namespace
      - https://github.com/RUCAIBox/RecBole/pull/2203
      - https://github.com/RUCAIBox/RecBole/pull/2187
    notes: >-
      Crash is expected from code inspection; no issue reports this exact line.
      Evidence quality is set to release_note_only because no report exists. Any
      ranking effect after a local alias repair (the pilot plan's "quick fix side effects")
      is unverified; PR 2187 replaces aliases with explicit dtypes, which could
      change precision if a float32 alias is chosen.

  - id: L6b
    project: RUCAIBox/RecBole
    url: https://github.com/RUCAIBox/RecBole/issues/2215
    claimed_symptom: >-
      RecBole BPR quick start raised AttributeError "module 'numpy' has no attribute
      'bool8'" in Ray's TensorBoard logger; after downgrading NumPy, evaluation failed
      with "Weights only load failed" under PyTorch 2.12.
    versions_old: {numpy: "1.26.4", torch: "2.5.1"}
    versions_new: {numpy: "2.4.6", torch: "2.12.0"}
    versions:
      dependency: numpy
      old_reported_workaround: "1.26.4"
      new_reported: "2.4.6"
