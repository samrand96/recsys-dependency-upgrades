[project]
name = "env-py312-np2-2-6-sp1-16-3-pd2-2-3-torch2-12-1-cu126"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.16.3",
    "pandas==2.2.3",
    "threadpoolctl==3.8.0",
    "torch==2.12.1",
]

[tool.uv]
package = false
exclude-newer = "2026-11-13T00:00:00Z"
constraint-dependencies = ["python-dateutil==4.0.0", "pytz==2026.6", "tzdata==2026.6"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
